<!-- Dashboard | Insights switch, plus page actions. Settings only exists on the dashboard. -->
<nav class="flex items-center gap-3">
    <div class="flex items-center rounded-xl glass-card overflow-hidden text-sm font-medium">
        <a href="/" class="px-4 py-2 transition-colors {{ 'bg-indigo-600 text-white' if active_page == 'dashboard' else 'text-slate-400 hover:text-slate-200' }}">Dashboard</a>
        <a href="/insights" class="px-4 py-2 transition-colors {{ 'bg-indigo-600 text-white' if active_page == 'insights' else 'text-slate-400 hover:text-slate-200' }}">Insights</a>
    </div>

    {% if active_page == 'dashboard' %}
    <!-- Settings Button -->
    <button @click="settingsModalOpen = true" class="p-2.5 glass-card rounded-xl text-slate-400 hover:text-indigo-400 transition-colors focus:outline-none" title="Settings">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </button>
    {% endif %}

    <!-- Account / Logout -->
    {% if current_user.is_authenticated %}
    <form method="POST" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit"
                class="p-2.5 glass-card rounded-xl text-slate-400 hover:text-red-400 transition-colors focus:outline-none"
                title="Sign out ({{ current_user.email }})">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </form>
    {% endif %}
</nav>
